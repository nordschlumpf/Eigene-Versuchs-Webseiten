<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formular</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body data-bs-theme="dark">

        <div class="container text-center">
            <div class="mx-auto p-2 col-md-8 col-lg-6">
                <h1>Kontaktformular</h1>

                <p>Hier können sie ihre Bestellung aufgeben</p>
            </div>
            <form class="row gy-3" style="text-align: left;">
                <p class="text-secondary small">
                    <span class="text-danger">*</span> Pflichtfelder
                </p>
                <div class="col-6">
                    <label for="name" class="form-label required">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Mustermann">
                </div> 
                <div class="col-6">
                    <label for="vorname" class="form-label required">Vorname</label>
                    <input type="text" class="form-control" id="vorname" placeholder="Max">
                </div> 
                <div class="col-6">
                    <label for="telefon" class="form-label">Telefonnummer</label>
                    <input type="tel" class="form-control" id="telefon">
                </div>
                <div class="col-6">
                    <label for="email" class="form-label required">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="max.mustermann@gmail.com">
                </div>               
                <div class="col-12">
                    <label for="adresse" class="form-label required">Adresse</label>
                    <input type="text" class="form-control" id="adresse" placeholder="1234 Main St">
                </div>
                <div class="col-6">
                    <label for="inputCity" class="form-label required">Stadt</label>
                    <input type="text" class="form-control" id="inputCity">
                </div>
                <div class="col-4">
                    <label for="inputState" class="form-label">Bundesland</label>
                    <select id="inputState" class="form-select">
                    <option selected>Bitte wählen...</option>
                    <option value="BW">Baden-Württemberg</option>
                    <option value="BY">Bayern</option>
                    <option value="BE">Berlin</option>
                    <option value="BB">Brandenburg</option>
                    <option value="HB">Bremen</option>
                    <option value="HH">Hamburg</option>
                    <option value="HE">Hessen</option>
                    <option value="MV">Mecklenburg-Vorpommern</option>
                    <option value="NI">Niedersachsen</option>
                    <option value="NW">Nordrhein-Westfalen</option>
                    <option value="RP">Rheinland-Pfalz</option>
                    <option value="SL">Saarland</option>
                    <option value="SN">Sachsen</option>
                    <option value="ST">Sachsen-Anhalt</option>
                    <option value="SH">Schleswig-Holstein</option>
                    <option value="TH">Thüringen</option>
                    </select>
                </div>
                <div class="col-2">
                    <label for="inputZip" class="form-label required">Postleitzahl</label>
                    <input type="text" class="form-control" id="inputZip">
                </div>
                <div class="mb-3">
                    <label for="floatingTextarea2" class="form-label">Lieferanweisungen</label>
                    <textarea class="form-control" id="floatingTextarea2" placeholder="Spezielle Anweisungen für die Bestellung..." style="height: 300px"></textarea>
                </div>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button type="button" class="btn btn-outline-primary">Absenden</button>
                </div>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </body>
</html>
